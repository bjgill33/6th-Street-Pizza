{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Checkout - 6th Street Pizza</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <link rel="icon" type="image/png" href="{% static 'logo/favicon.png' % }" />
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC3y0aTpDcrzntE4cyPhDLKvHTHC76uN64&callback=initMaps"
      async
      defer
    ></script>
    <script src="{% static 'js/pay_validation.js' %}" async></script>
    <script>
      function initMaps() {
        console.log("Google Maps initialized");
      }
    </script>

  </head>

  <body>
    {% include 'navbar.html' %}

    <!-- Secure Checkout Section -->
    <section class="checkout-section py-5">
      <div class="container">
        <h2 class="text-center mb-4">Secure Checkout</h2>
        <div class="row">
          <!-- Order Review -->

          <!-- Order Review -->
          <div class="col-md-4">
            <h4>Review Your Order</h4>
            <div class="card p-3 mb-3">
              <div id="orderReviewItems"></div>
              <!-- Cart items will be inserted here -->
              <p class="mt-3">
                <strong>Total:</strong> <span id="orderTotal">$0.00</span>
              </p>

              <div class="d-flex gap-3">
                <button
                  class="btn btn-secondary"
                  data-bs-toggle="modal"
                  data-bs-target="#cartModal"
                >
                  Edit
                </button>
                <a
                  href="https://6thstreetpizza.store/menu/"
                  class="btn btn-primary"
                  >Add More</a
                >
              </div>
            </div>
          </div>

          <script>
            document.addEventListener("DOMContentLoaded", function () {
              fetch("/cart/data/", {
                method: "GET",
                credentials: "include", // Ensures Django session is used
              })
                .then((response) => response.json())
                .then((data) => {
                  const cart = data.cart || {};
                  const cartContainer =
                    document.getElementById("orderReviewItems");
                  const cartTotalElement =
                    document.getElementById("orderTotal");

                  cartContainer.innerHTML = ""; // Clear previous content
                  let totalCartPrice = 0;

                  if (Object.keys(cart).length === 0) {
                    cartContainer.innerHTML =
                      "<p class='text-muted'>Your cart is empty.</p>";
                    cartTotalElement.textContent = "$0.00";
                    return;
                  }

                  Object.values(cart).forEach((item) => {
                    const itemPrice = parseFloat(item.price) * item.quantity;
                    totalCartPrice += itemPrice;

                    // Create item row
                    const cartItemHTML = `
          <div class="d-flex align-items-center justify-content-between border-bottom py-2">
            <!--<img src="/static/images/${item.name
              .toLowerCase()
              .replace(/ /g, "_")}.jpg" alt="${
                      item.name
                    }" style="width: 50px; height: 50px; object-fit: contain;"> -->
            <div class="ms-2">
              <strong>${item.name} (${item.size || "N/A"})</strong><br>
              <small>Qty: ${item.quantity} | ${
                      item.toppings.length
                        ? "Toppings: " + item.toppings.join(", ")
                        : "No extra toppings"
                    }</small>
              <br><strong>Price: $${itemPrice.toFixed(2)}</strong>
            </div>
          </div>
        `;
                    cartContainer.innerHTML += cartItemHTML;
                  });

                  // Update total price
                  cartTotalElement.textContent = `$${totalCartPrice.toFixed(
                    2
                  )}`;
                })
                .catch((error) => {
                  console.error("Error loading cart:", error);
                });
            });
          </script>

          <!-- Delivery Address -->
          <div class="col-md-4">
            <h4>Delivery Address</h4>
            <form>
              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="example@example.com"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  class="form-control"
                  placeholder="John Doe"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-control"
                  placeholder="123-456-7890"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Address</label>
                <input
                  type="text"
                  id="address"
                  name="address"
                  class="form-control"
                  placeholder="123 Main St, Apt 4B"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">City</label>
                <input
                  type="text"
                  id="city"
                  name="city"
                  class="form-control"
                  placeholder="Los Angeles"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">State</label>
                <select id="state" name="state" class="form-select" required>
                  <option value="">Choose your state...</option>
                  <option>California</option>
                  <option>Texas</option>
                  <option>Florida</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Zip Code</label>
                <input
                  type="text"
                  id="zip"
                  name="zip"
                  class="form-control"
                  placeholder="90210"
                  required
                />
              </div>
            </form>
          </div>

          <!-- Payment Details -->
          <div class="col-md-4">
            <h4>Payment Details</h4>
            <form id="payment-form">
              <!-- Card Number -->
              <div class="mb-3">
                <label for="card-number-element" class="form-label">Card Number</label>
                <div class="form-control p-0">
                  <div id="card-number-element" class="stripe-element px-2 py-2"></div>
                </div>
              </div>

              <!-- Expiration Date -->
              <div class="mb-3">
                <label for="card-expiry-element" class="form-label">Expiration Date</label>
                <div class="form-control p-0">
                  <div id="card-expiry-element" class="stripe-element px-2 py-2"></div>
                </div>
              </div>

              <!-- CVC -->
              <div class="mb-3">
                <label for="card-cvc-element" class="form-label">CVC</label>
                <div class="form-control p-0">
                  <div id="card-cvc-element" class="stripe-element px-2 py-2"></div>
                </div>
              </div>

              <!-- Card Errors -->
              <div id="card-errors" role="alert" class="text-danger mt-2"></div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary w-100 mt-3">Pay Now</button>

              <!-- Accepted Payment Image -->
              <div>
                <img
                  class="pt-4 d-block mx-auto img-fluid"
                  src="{% static 'images/payment_options.png' %}"
                  alt="Accepted Payment Methods"
                />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- footer -->
    {% include 'footer.html' %}

    <script>
      // 🔗 Global data injected from Django context
      window.csrfTokenHTML = `{% csrf_token %}`;
      window.toppingsList = {{ toppings_json|safe }};
    </script>

    <!-- 🧩 Global Variables (rendered server-side) -->
    <script src="{% static 'js/cartHandler.js' %}"></script>
    <script src="{% static 'js/orderModalGlobals.js' %}"></script>
    <script src="{% static 'js/locationsModal.js' %}"></script>
    <script src="{% static 'js/orderModal.js' %}"></script>
    <script src="{% static 'js/orderModalHandler.js' %}"></script>
    <script src="{% static 'js/locations.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Strip payment -->
    <script src="https://js.stripe.com/v3/"></script>
          <script>
            document.addEventListener("DOMContentLoaded", function() {
              const stripe = Stripe("{{ stripe_public_key }}");
              const elements = stripe.elements();
          
              const style = {
                base: {
                  color: "#212529",
                  fontFamily: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif",
                  fontSize: "1rem",
                  fontSmoothing: "antialiased",
                  padding: "0.375rem 0.75rem",
                  '::placeholder': {
                    color: "#6c757d",
                  },
                },
                invalid: {
                  color: "#dc3545", // Bootstrap's danger color
                  iconColor: "#dc3545",
                },
              };
              
              const cardNumber = elements.create("cardNumber", { style });
              const cardExpiry = elements.create("cardExpiry", { style });
              const cardCvc = elements.create("cardCvc", { style });
              
              cardNumber.mount("#card-number-element");
              cardExpiry.mount("#card-expiry-element");
              cardCvc.mount("#card-cvc-element");
              
              function showCardError(error) {
                const displayError = document.getElementById("card-errors");
                displayError.textContent = error ? error.message : "";
              }
              
              cardNumber.on("change", event => showCardError(event.error));
              cardExpiry.on("change", event => showCardError(event.error));
              cardCvc.on("change", event => showCardError(event.error));
          
              const form = document.getElementById("payment-form");
          
              form.addEventListener("submit", async function(event) {
                event.preventDefault();  // Prevent the form from submitting
          
                const email = document.getElementById("email").value;
                const fullName = document.getElementById("fullName").value;
                const phone = document.getElementById("phone").value;
                const address = document.getElementById("address").value;
                const city = document.getElementById("city").value;
                const state = document.getElementById("state").value;
                const zip = document.getElementById("zip").value;
          
                const { clientSecret } = await fetch("/create-payment-intent/", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}",
                  },
                  body: JSON.stringify({
                    email,
                    fullName,
                    phone,
                    address,
                    city,
                    state,
                    zip,
                  }),
                }).then((r) => r.json());
          
                const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
                  payment_method: {
                    card: cardNumber,
                    billing_details: {
                      name: fullName,
                      email: email,
                      phone: phone,
                      address: {
                        line1: address,
                        city: city,
                        state: state,
                        postal_code: zip,
                      },
                    },
                  },
                });
          
                if (error) {
                  document.getElementById("card-errors").textContent = error.message;
                } else if (paymentIntent.status === "succeeded") {
                  window.location.href = "/payment-success/";  // Redirect on success
                }
              });
            });
          </script>
  </body>
</html>
