{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coupons - 6th Street Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <link rel="icon" type="image/png" href="{% static 'logo/favicon.png' %}" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
          <img src="{% static 'logo/6th_street_pizza.png' %}" alt="6th Street Pizza Logo" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'menu' %}">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'store_locations' %}">Locations</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'coupons' %}">Coupons</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'track_order' %}">Tracker</a></li>
            <li class="nav-item position-relative">
              <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#cartModal">
                <i class="bi bi-cart text-white" style="font-size: 1.5rem"></i>
                <span id="cartBadge" class="cart-badge">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>


      <div style="height: 200px;"></div>


    <!-- Footer -->
    <footer class="footer bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p>&copy; 2025 6th Street Pizza. All Rights Reserved.</p>
      </div>
    </footer>

    <script>
      window.csrfTokenHTML = `{% csrf_token %}`;
      window.toppingsList = {{ toppings_json|safe }};
    </script>

    <!--  Global Variables (rendered server-side) -->
    <script src="{% static 'js/stripePaymentHandler.js' %}"></script>
    <script src="{% static 'js/orderTypeHandler.js' %}"></script>
    <script src="{% static 'js/cartHandler.js' %}"></script>
    <script src="{% static 'js/orderModalGlobals.js' %}"></script>
    <script src="{% static 'js/locationsModal.js' %}"></script>
    <script src="{% static 'js/orderModal.js' %}"></script>
    <script src="{% static 'js/orderModalHandler.js' %}"></script>
    <script src="{% static 'js/locations.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
